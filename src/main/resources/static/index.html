<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>URL Shortener</title>
    <link rel="stylesheet" href="/style.css">
</head>
<body>
    <main class="container">
        <h1>🔗 URL Shortener</h1>
        <p class="subtitle">A demo client for the Spring Boot URL Shortener API</p>

        <form id="shorten-form">
            <input type="url" id="url-input" placeholder="https://example.com/a/very/long/url" required>
            <button type="submit">Shorten</button>
        </form>

        <div id="result" class="result hidden"></div>

        <h2>Your Links</h2>
        <table id="links-table">
            <thead>
                <tr>
                    <th>Short Link</th>
                    <th>Original URL</th>
                    <th>Created</th>
                    <th>Actions</th>
                </tr>
            </thead>
            <tbody id="links-body"></tbody>
        </table>

        <p class="footer">
            API docs: <a href="/swagger-ui.html">/swagger-ui.html</a>
        </p>
    </main>

    <script src="/app.js"></script>
</body>
</html>
