spring:
  application:
    name: urlshortener

  # Default profile uses H2 in-memory DB so the project runs with zero setup.
  # Activate the "mysql" profile (see application-mysql.yml) for a real DB.
  datasource:
    url: jdbc:h2:mem:urlshortener;DB_CLOSE_DELAY=-1;CASE_INSENSITIVE_IDENTIFIERS=TRUE
    driver-class-name: org.h2.Driver
    username: sa
    password: ""

  h2:
    console:
      enabled: true
      path: /h2-console

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        format_sql: true
    open-in-view: false

server:
  port: 8080

# Base URL used when building fully-qualified short links in API responses
# / the demo frontend. Override in prod via APP_BASE_URL env var.
app:
  base-url: ${APP_BASE_URL:http://localhost:8080}

management:
  endpoints:
    web:
      exposure:
        include: health,info

springdoc:
  swagger-ui:
    path: /swagger-ui.html
  api-docs:
    path: /v3/api-docs

logging:
  level:
    com.example.urlshortener: INFO
